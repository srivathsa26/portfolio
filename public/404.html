<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Srivathsa SH</title>
  <link rel="icon" href="/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #F8F9FA;
      color: #0C0C0E;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'Syne', sans-serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 1rem;
      color: #0C0C0E;
    }
    .message {
      font-size: 1.125rem;
      color: #6B7280;
      margin-bottom: 2rem;
      max-width: 28ch;
      margin-left: auto;
      margin-right: auto;
    }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.5rem;
      border-radius: 0.75rem;
      background: #0C0C0E;
      color: #F8F9FA;
      font-weight: 500;
      font-size: 0.875rem;
      text-decoration: none;
      transition: background 0.2s;
    }
    .link:hover { background: #1A5FFF; }
  </style>
</head>
<body>
  <div class="container">
    <p class="code">404</p>
    <p class="message">This page doesn't exist. Maybe the URL is wrong, or it's been moved.</p>
    <a href="/" class="link">Back to portfolio</a>
  </div>
</body>
</html>
